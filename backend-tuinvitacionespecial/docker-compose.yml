services:
  postgres:
    image: postgres:18.7-alpine
    container_name: tuinvitacion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tuinvitacion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tuinvitacion_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tuinvitacionespecial}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tuinvitacion} -d ${POSTGRES_DB:-tuinvitacionespecial}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0-alpine
    container_name: tuinvitacion-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
